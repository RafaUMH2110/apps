# Regenera el portal (appindex) y despliega GitHub Pages en un único flujo.
#
# Antes había dos workflows independientes: el despliegue publicaba el árbol
# de ANTES de regenerar el portal (un push por detrás) y el commit del bot,
# hecho con GITHUB_TOKEN, no vuelve a lanzar workflows. Encadenados con
# `needs`, el despliegue parte siempre del portal ya actualizado.
name: Portal y Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Un solo despliegue a la vez; los pendientes esperan (no se cancelan).
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync-portal:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate portal
        run: python3 .github/scripts/generate_index.py

      - name: Commit and push if the catalog changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appindex/index.html appindex/temas/index.html
          if git diff --cached --quiet; then
            echo "Portal sin cambios."
            exit 0
          fi
          # La única línea que cambia en cada ejecución es la fecha de
          # «Última actualización». Si no cambia nada más, no se hace commit.
          cambios=$(git diff --cached -U0 | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | grep -v 'Última actualización' || true)
          if [ -z "$cambios" ]; then
            echo "Solo cambia la fecha de actualización; no se hace commit."
            git reset -q
            git checkout -- appindex/index.html appindex/temas/index.html
            exit 0
          fi
          git commit -m "Update artifacts portal (auto-sync)"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    needs: sync-portal
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (incluye el commit del portal, si lo hubo)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build site (sin .git, .github ni zips)
        run: |
          mkdir -p ../_site
          tar --exclude='./.git' --exclude='./.github' --exclude='__pycache__' \
              --exclude='*.zip' --exclude='./.gitignore' --exclude='./.gitattributes' \
              --exclude='./CLAUDE.md' -cf - . | tar -xf - -C ../_site
          mv ../_site ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
