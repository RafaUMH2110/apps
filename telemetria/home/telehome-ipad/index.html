<style>
/* ---- Colores: paleta de series validada (claro/oscuro) y superficies estilo iOS ---- */
:root {
  color-scheme: light dark;
  --page:#f2f2f0; --surface:#ffffff; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e6e5df; --axis:#c3c2b7; --border:rgba(11,11,11,.10); --accent:#2a78d6; --on-accent:#fff;
  --good:#0ca30c; --critical:#d03b3b; --warn-bg:#fff4d6; --bar:rgba(249,249,247,.82); --segsel:#fff;
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100;
  --series-5:#e87ba4; --series-6:#008300; --series-7:#6250d6;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page:#000; --surface:#1c1c1e; --ink:#f2f2f0; --ink2:#c3c2b7; --muted:#8e8e93;
    --grid:#2c2c2e; --axis:#48484a; --border:rgba(255,255,255,.12); --accent:#3987e5; --warn-bg:#3a2f0b;
    --bar:rgba(28,28,30,.82); --segsel:#636366;
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500;
    --series-5:#d55181; --series-6:#0ca30c; --series-7:#9085e9;
  }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--page); color:var(--ink); font:17px/1.35 var(--font);
  -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
button, input, select { font:inherit; color:inherit; }
button { -webkit-appearance:none; appearance:none; }
input { -webkit-user-select:text; user-select:text; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
[hidden] { display:none !important; }
.icon-btn:active { background:var(--grid); }
.icon-btn svg { width:22px; height:22px; }
.icon-btn.spin svg { animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
@media (prefers-reduced-motion:reduce) { * { animation:none !important; transition:none !important; } }

/* ---- Cabecera: piezas comunes ---- */
.logo { border-radius:7px; flex:none; display:block; box-shadow:0 1px 3px rgba(0,0,0,.18); }
.dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--muted); flex:none; box-shadow:0 0 0 3px color-mix(in srgb, var(--muted) 22%, transparent); }
.dot[data-estado="good"] { background:var(--good); box-shadow:0 0 0 3px color-mix(in srgb, var(--good) 22%, transparent); }
.dot[data-estado="warn"] { background:var(--series-4); box-shadow:0 0 0 3px color-mix(in srgb, var(--series-4) 25%, transparent); }
.dot[data-estado="bad"] { background:var(--critical); box-shadow:0 0 0 3px color-mix(in srgb, var(--critical) 22%, transparent); }
.icon-btn .lbl { display:none; }

/* ---- Avisos ---- */
.banner { background:var(--warn-bg); border:1px solid var(--border); border-radius:12px; padding:10px 14px; font-size:15px; }
.banner button { margin-top:8px; border:none; background:var(--accent); color:var(--on-accent); border-radius:9px; min-height:36px; padding:0 14px; font-weight:600; }

/* ---- Tarjetas y listas ---- */
.card { background:var(--surface); border-radius:14px; box-shadow:0 1px 2px rgba(0,0,0,.05); overflow:hidden; }
.grp { margin-bottom:18px; }
.grp-h { display:flex; align-items:center; gap:8px; padding:0 4px 6px; color:var(--ink2); font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.4px; }
.grp-h svg { width:16px; height:16px; }
.grp-h .n { margin-left:auto; text-transform:none; letter-spacing:0; font-weight:500; }
.dev { display:flex; align-items:center; gap:12px; padding:12px 14px; border-top:.5px solid var(--border); position:relative; }
.dev:first-child { border-top:none; }
.dev::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--c); }
.dev .id { flex:1; min-width:0; }
.dev .nm { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dev .sub { color:var(--ink2); font-size:13px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dev .sub .on { color:var(--good); font-weight:600; }
.dev .sub .off { color:var(--critical); font-weight:600; }
.dev .val { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
.dev .val b { font-size:24px; font-weight:600; letter-spacing:-.4px; }
.dev .val span { color:var(--ink2); font-size:13px; margin-left:2px; }
.dev.sel { background:color-mix(in srgb, var(--accent) 9%, transparent); }
.gauge { height:4px; border-radius:2px; background:var(--grid); overflow:hidden; margin-top:6px; }
.gauge i { display:block; height:100%; background:var(--c); }

/* ---- Controles ---- */
.sw { width:51px; height:31px; flex:none; border-radius:16px; border:none; background:var(--grid); position:relative; transition:background .18s; }
.sw::after { content:""; position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:transform .18s; }
.sw[aria-checked="true"] { background:var(--good); }
.sw[aria-checked="true"]::after { transform:translateX(20px); }
.sw:disabled { opacity:.4; }
.sw.busy { opacity:.6; }
.pos { display:flex; gap:6px; flex:none; }
.pos button { width:44px; height:38px; border-radius:9px; border:1px solid var(--border); background:var(--page); display:grid; place-items:center; }
.pos button:disabled { opacity:.4; }
.pos svg { width:20px; height:20px; }
.lvl { display:flex; align-items:center; gap:10px; flex:none; }
.lvl input[type=range] { width:112px; accent-color:var(--c); }
.lvl input[type=range]:disabled { opacity:.4; }
.ro { color:var(--muted); font-size:13px; flex:none; }

/* ---- Segmentos ---- */
.seg { display:flex; background:var(--grid); border-radius:9px; padding:2px; gap:2px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.seg::-webkit-scrollbar { display:none; }
.seg button { flex:1 0 auto; min-height:32px; padding:0 12px; border:none; background:transparent; border-radius:7px; font-size:14px; font-weight:600; color:var(--ink2); white-space:nowrap; }
.seg button[aria-pressed="true"] { background:var(--segsel); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.12); }

/* ---- Gráfica ---- */
.chart-wrap { position:relative; }
svg.chart { width:100%; display:block; touch-action:pan-y; }
.c-grid { stroke:var(--grid); stroke-width:1; }
.c-axis { fill:var(--axis); font-size:11px; }
.c-muted { fill:var(--muted); font-size:14px; }
.c-cross { stroke:var(--axis); stroke-width:1; stroke-dasharray:3 3; }
.tip { position:absolute; top:6px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:7px 10px; font-size:13px; pointer-events:none; box-shadow:0 4px 14px rgba(0,0,0,.18); min-width:120px; }
.tip b { display:block; margin-bottom:4px; font-variant-numeric:tabular-nums; }
.tip-row { display:flex; align-items:center; gap:6px; }
.tip-key { width:10px; height:3px; border-radius:2px; flex:none; }
.tip-name { flex:1; color:var(--ink2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tip-val { font-variant-numeric:tabular-nums; }
.legend { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.legend button { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border); background:var(--surface); border-radius:999px; min-height:32px; padding:0 12px; font-size:13px; }
.legend button[aria-pressed="false"] { opacity:.45; text-decoration:line-through; }
.legend .k { width:12px; height:3px; border-radius:2px; }

/* ---- Tablas del resumen ---- */
table { width:100%; border-collapse:collapse; font-size:14px; }
th, td { padding:9px 12px; text-align:right; white-space:nowrap; }
th:first-child, td:first-child { text-align:left; }
thead th { color:var(--ink2); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.3px; }
tbody tr { border-top:.5px solid var(--border); }
tfoot td { border-top:.5px solid var(--border); font-weight:700; }
.tscroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
.key { display:inline-block; width:12px; height:3px; border-radius:2px; vertical-align:middle; margin-right:7px; }

/* ---- Formularios y filas de ajustes ---- */
.rows { background:var(--surface); border-radius:14px; overflow:hidden; }
.row { display:flex; align-items:center; gap:12px; padding:12px 14px; border-top:.5px solid var(--border); min-height:48px; }
.row:first-child { border-top:none; }
.row .lab { flex:1; min-width:0; }
.row .lab small { display:block; color:var(--ink2); font-size:13px; margin-top:2px; white-space:normal; }
.row input[type=text], .row input[type=password] { flex:1; min-width:0; border:1px solid var(--border); background:var(--page); border-radius:9px; padding:8px 10px; font-size:15px; }
.row .act { border:none; background:transparent; color:var(--accent); font-weight:600; padding:0; min-height:44px; }
.row .act.danger { color:var(--critical); }
.msg { font-size:14px; padding:2px 4px 0; min-height:1.2em; }
.msg.bad { color:var(--critical); }
.msg.ok { color:var(--ink2); }
.hint { color:var(--ink2); font-size:13px; padding:8px 4px 0; }
.ro-badge { font-size:12px; font-weight:700; color:var(--ink2); background:var(--grid); border-radius:999px; padding:2px 9px; vertical-align:middle; }

/* ---- Avisos flotantes y hoja modal ---- */
.toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom) + 72px);
  background:rgba(0,0,0,.86); color:#fff; padding:10px 16px; border-radius:999px; font-size:14px; z-index:60; max-width:90vw; text-align:center; }
.sheet-bg { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:70; }
.sheet { position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:min(520px,100%); z-index:71;
  background:var(--surface); border-radius:18px 18px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom));

.sheet h2 { margin:0 0 6px; font-size:19px; }
.sheet p { margin:0 0 14px; color:var(--ink2); font-size:15px; }
.sheet input { width:100%; border:1px solid var(--border); background:var(--page); border-radius:10px; padding:11px 12px; font-size:16px; margin-bottom:10px; }
.sheet .btns { display:flex; gap:10px; }
.sheet .btns button { flex:1; min-height:46px; border-radius:12px; border:none; font-weight:600; background:var(--grid); color:var(--ink); }
.sheet .btns button.pri { background:var(--accent); color:var(--on-accent); }
.sheet .btns button.danger { background:var(--critical); color:#fff; }
.foot { color:var(--muted); font-size:12px; text-align:center; padding:16px 10px 4px; line-height:1.5; }
.foot a { color:var(--muted); }

/* ---------- luces: botón de color en la fila y hoja de control ---------- */
.lt-btn { width:34px; height:34px; flex:none; border-radius:50%; border:2px solid var(--lc,#ffb15e); background:transparent; color:var(--lc,#ffb15e); display:grid; place-items:center; padding:0; }
.lt-btn svg { width:18px; height:18px; }
.lt-btn:disabled { opacity:.4; }
.lz-head { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.lz-sw { width:42px; height:42px; flex:none; border-radius:50%; background:var(--lc,#ffb15e); box-shadow:0 0 18px var(--lc,#ffb15e); }
.lz-t { flex:1; min-width:0; }
.lz-t h2 { margin:0; font-size:18px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.lz-sub { color:var(--ink2); font-size:14px; }
.lz-row { margin-bottom:14px; }
.lz-l { display:flex; justify-content:space-between; font-size:14px; color:var(--ink2); margin-bottom:6px; }
.lz-l b { color:var(--ink); font-weight:600; }
.lz-row input[type=range] { display:block; width:100%; height:28px; margin:0 0 8px; padding:0; border:none; border-radius:14px; accent-color:var(--accent); }
.lz-row input[type=range]:disabled { opacity:.4; }
.lz-pre { display:flex; flex-wrap:wrap; gap:8px; margin-top:4px; }
.lz-pre .chip { flex:1; min-height:40px; border-radius:10px; border:1px solid var(--border); background:var(--grid); color:var(--ink); font-weight:600; }
.lz-pre .dot { width:36px; height:36px; border-radius:50%; border:2px solid var(--page); box-shadow:0 0 0 1px var(--border); padding:0; }
.lz-pre button:disabled { opacity:.4; }
.lz-seg { display:flex; gap:4px; background:var(--grid); border-radius:12px; padding:3px; margin-bottom:14px; }
.lz-seg button { flex:1; min-height:38px; border:none; border-radius:10px; background:transparent; color:var(--ink); font-weight:600; }
.lz-seg button[aria-pressed="true"] { background:var(--page); box-shadow:0 1px 3px rgba(0,0,0,.2); }
.lz-seg button:disabled { opacity:.5; }
.sheet .lz-row input[type=range] { margin-bottom:8px; }
.lz-row input[type=range] { -webkit-appearance:none; appearance:none; background:var(--grid); height:22px; }
.lz-row input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:30px; height:30px; border-radius:50%; background:#fff; border:1px solid rgba(0,0,0,.25); box-shadow:0 1px 4px rgba(0,0,0,.3); }
.lz-row input[type=range]::-moz-range-thumb { width:28px; height:28px; border-radius:50%; background:#fff; border:1px solid rgba(0,0,0,.25); box-shadow:0 1px 4px rgba(0,0,0,.3); }
.lz-pre { margin-bottom:6px; }
.sheet .lz-pre + .btns, .sheet .lz-row + .btns, .sheet .lz-seg + .btns { margin-top:14px; }
.sheet .btns { margin-top:14px; }

html { -webkit-text-size-adjust:100%; overflow-x:hidden; }
/* ---- Barra superior ---- */
.bar { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:10px;
  padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 18px) 8px calc(env(safe-area-inset-left) + 18px);
  background:var(--bar); -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px); border-bottom:.5px solid var(--border); }
.bar h1 { margin:0; font-size:22px; font-weight:700; letter-spacing:-.3px; }
.bar .grow { flex:1; }
.pill { display:inline-flex; align-items:center; gap:8px; margin-left:6px; padding:5px 12px 5px 10px; border-radius:999px;
  background:color-mix(in srgb, var(--ink) 6%, transparent); min-width:0; }
.pill .sub { color:var(--ink2); font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.icon-btn { min-width:44px; height:44px; padding:0 12px; border:none; background:transparent; color:var(--accent);
  border-radius:11px; display:inline-flex; align-items:center; justify-content:center; gap:7px; }
.icon-btn .lbl { display:inline; font-size:15px; font-weight:600; }
@media (max-width:640px) { .icon-btn .lbl { display:none; } }
.icon-btn[aria-pressed="true"] { background:color-mix(in srgb, var(--good) 18%, transparent); color:var(--good); }
#btnAjustes[aria-pressed="true"] { background:color-mix(in srgb, var(--accent) 16%, transparent); color:var(--accent); }
.banner { margin:12px calc(env(safe-area-inset-right) + 18px) 0 calc(env(safe-area-inset-left) + 18px); }
/* ---- Vista dividida ---- */
.split { display:grid; grid-template-columns:minmax(300px, 380px) 1fr; gap:20px; align-items:start;
  padding:16px calc(env(safe-area-inset-right) + 18px) calc(env(safe-area-inset-bottom) + 28px) calc(env(safe-area-inset-left) + 18px); }
.split > aside { position:sticky; top:calc(env(safe-area-inset-top) + 76px); }
@media (max-width:860px) { .split { grid-template-columns:1fr; } .split > aside { position:static; } }
.dev { padding:13px 15px; }

/* ---- Controles compactos: dejan sitio al nombre del dispositivo ---- */
.lvl input[type=range] { width:96px; }
.pos button { width:38px; }
.dev .nm { font-size:16px; }
.gauge { background:color-mix(in srgb, var(--ink) 12%, transparent); }
</style>

/* =====================================================================
   Núcleo común de TeleHome para iPhone y iPad: utilidades, catálogo de

/* ---------- utilidades ---------- */
const NS = "http://www.w3.org/2000/svg";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

async function api(path, opt = {}) {

  if (APP.admin.token) h["X-TeleHome-Admin"] = APP.admin.token;
  const init = { method: opt.method || "GET", headers: h, cache: "no-store" };
  if (opt.body !== undefined) { init.body = JSON.stringify(opt.body); h["Content-Type"] = "application/json"; }
  const r = await fetch(APP.base + path, init);
  let data = null;
  try { data = await r.json(); } catch (e) { /* respuesta no JSON */ }
  if (r.status === 403 && data && data.admin_required) {        // la sesión caducó o el nivel no basta
    if (data.nivel_necesario !== "admin" || APP.admin.nivel !== "user") { APP.admin.nivel = "none"; APP.admin.token = ""; sess.set("admin", ""); }
  }
  if (!r.ok) { const err = new Error((data && data.error) || ("Error " + r.status)); err.status = r.status; throw err; }

    if (r.status === 401) return "auth";
    if (!r.ok) return null;
    const j = await r.json();
    return j && (j.ok || j.api === "telehome" || /^TeleHome/.test(j.app || "")) ? "ok" : null;

    ...rows.map((r) => el("div", { class: "tip-row" }, el("span", { class: "tip-key", style: "background:" + colorOf(r.s.dev) }),
      el("span", { class: "tip-name", text: r.s.dev.name }), el("span", { class: "tip-val", text: fmt(r.p.y, g.m.dec) + " " + g.m.unit }))));
  tip.hidden = false;
  const wrap = svg.parentElement.getBoundingClientRect(), sx = (x / g.W) * rect.width + (rect.left - wrap.left);

function clearHover(svg) {

/* ---------- ciclo de actualización ---------- */
function startPolling(onTick, getSeg = () => 5) {
  let timer = null;
  const tick = async () => { await onTick(); timer = document.hidden ? null : setTimeout(tick, getSeg() * 1000); };
  const stop = () => { clearTimeout(timer); timer = null; };

  for (const k of ms) segM.append(el("button", { type: "button", text: METRICS[k].label, "aria-pressed": String(APP.metric === k),
    onclick: () => { APP.metric = k; APP.hidden.clear(); pintar(); recargarHistorico(); } }));
  const segR = el("div", { class: "seg", role: "group", "aria-label": "Intervalo", style: "margin-top:8px" });
  for (const [lab, secs] of RANGES) segR.append(el("button", { type: "button", text: lab, "aria-pressed": String(APP.range === secs),
    onclick: () => { APP.range = secs; prefs.set("range", secs); pintar(); recargarHistorico(); } }));
  caja.append(segM, segR);

  const svg = sv("svg", { class: "chart", role: "img", "aria-label": "Histórico de " + (METRICS[APP.metric] || {}).label });
  const tip = el("div", { class: "tip", hidden: true });
  const wrap = el("div", { class: "chart-wrap", style: "margin-top:12px" }, svg, tip);
  caja.append(el("div", { class: "card", style: "padding:12px" }, wrap));
  const list = metricDevs();
  if (list.length > 1) {
    const lg = el("div", { class: "legend", role: "group", "aria-label": "Series visibles" });
    for (const d of list) lg.append(el("button", { type: "button", "aria-pressed": String(!APP.hidden.has(d.id)),
      onclick: () => { APP.hidden.has(d.id) ? APP.hidden.delete(d.id) : APP.hidden.add(d.id); pintar(); } },
      el("span", { class: "k", style: "background:" + colorOf(d) }), d.name));
    caja.append(lg);
  }
  if (APP.sel !== "all") {
    const d = devs().find((x) => x.id === APP.sel);
    caja.append(el("div", { class: "legend" },
      el("button", { type: "button", onclick: () => { APP.sel = "all"; pintar(); recargarHistorico(); }, text: "Ver todos" }),
      d ? el("a", { class: "legend-a", href: csvUrl(d.id), download: "" },
        el("button", { type: "button", onclick: (e) => { e.preventDefault(); descargarCsv(d); } }, icono(ICONOS.descargar), "CSV de " + d.name)) : null));
  }
  requestAnimationFrame(() => { drawChart(svg, tip, alto); bindChart(svg); });
  return caja;
}
/* El CSV puede necesitar la contraseña del servicio o la sesión de administrador: se baja por fetch */
async function descargarCsv(d) {
  try {
    const h = AUTH.headers({ "X-TeleHome": "1" });
    if (APP.admin.token) h["X-TeleHome-Admin"] = APP.admin.token;
    const r = await fetch(csvUrl(d.id), { headers: h, cache: "no-store" });
    if (!r.ok) throw new Error("Error " + r.status);
    const a = el("a", { href: URL.createObjectURL(await r.blob()), download: "telehome-" + d.id + ".csv" });
    document.body.append(a); a.click(); a.remove();
    toast("CSV de «" + d.name + "» descargado.");
  } catch (e) { toast("No se pudo descargar el CSV: " + e.message, true); }
}

/* ---------- panel: resumen ---------- */
function panelResumen() {
  const caja = el("div");
  const lab = RANGES.find((r) => r[1] === APP.range);
  caja.append(el("div", { class: "grp-h", style: "padding-left:4px" }, "Últimas " + (lab ? lab[0] : "")));
  const filas = sumRows();
  if (!APP.sum) { caja.append(el("div", { class: "card", style: "padding:22px;text-align:center;color:var(--ink2)", text: "Cargando…" })); return caja; }
  for (const k of typesPresent()) {
    const t = TYPES[k] || TIPO_DESCONOCIDO, list = devsOfType(k).filter((d) => filas[d.id]);
    if (!list.length) continue;
    const cols = t.summary || [];
    const thead = el("tr", {}, el("th", { text: t.label }));
    for (const c of cols) thead.append(el("th", { text: c.label }));
    const tbody = el("tbody");
    for (const d of list) {
      const tr = el("tr", {}, el("td", {}, el("span", { class: "key", style: "background:" + colorOf(d) }), d.name));
      for (const c of cols) tr.append(el("td", { text: sumCell(c, filas[d.id]) }));
      tbody.append(tr);
    }
    const tfoot = el("tfoot");
    if (cols.some((c) => c.total === "sum")) {
      const tr = el("tr", {}, el("td", { text: "Total" }));
      for (const c of cols) {
        if (c.total !== "sum") { tr.append(el("td", { text: "" })); continue; }
        const suma = list.reduce((a, d) => a + (+sumValue(filas[d.id], c.key) || 0), 0);
        tr.append(el("td", { text: fmt(suma, c.dec) + (c.unit ? " " + c.unit : "") }));
      }
      tfoot.append(tr);
    }
    caja.append(el("section", { class: "grp" },
      el("div", { class: "card tscroll" }, el("table", {}, el("thead", {}, thead), tbody, tfoot))));
  }
  if (!caja.querySelector("table")) caja.append(el("div", { class: "card", style: "padding:22px;text-align:center;color:var(--ink2)", text: "Aún no hay datos en este intervalo." }));
  return caja;
}

/* ---------- panel: ajustes ---------- */
function filaAjuste(lab, sub, accion) {
  return el("div", { class: "row" }, el("div", { class: "lab" }, lab, sub ? el("small", { text: sub }) : null), accion);
}
function panelAjustes() {
  const caja = el("div");
  const rows = el("div", { class: "rows" });
  /* modo Administrador */
  if (pideClave()) {
    rows.append(filaAjuste("Sesión: " + etiquetaNivel(),
      esAdmin() ? "Puedes manejar los dispositivos y cambiar ajustes."
        : puedeMandar() ? "Puedes manejar los dispositivos, pero no cambiar la configuración."
        : "Ahora solo puedes ver los datos. Entra con tu contraseña de usuario o de administrador.",
      el("button", { class: "act", type: "button", text: APP.admin.nivel !== "none" ? "Salir" : "Entrar",
        onclick: async () => {
          if (APP.admin.nivel !== "none") { await salirAdmin(); toast("Has salido: vuelves al modo de solo lectura."); await recargar(); }
          else pedirAdmin();
        } })));
  } else {
    rows.append(filaAjuste("Sesión", "Este servicio no pide contraseña: se puede manejar todo.", el("span", { class: "ro", text: "abierto" })));
  }
  /* contraseña del servicio guardada en este dispositivo */
  if (AUTH.hdr) {
    rows.append(filaAjuste("Contraseña del servicio", "Guardada en este dispositivo.",
      el("button", { class: "act", type: "button", text: "Olvidar",
        onclick: async () => { AUTH.clear(); APP.base = null; toast("Contraseña del servicio olvidada."); await recargar(); } })));
  }
  /* API */
  const manual = prefs.get("api", "");
  const inp = el("input", { type: "text", value: manual, placeholder: APP.base || "/rafa/telehome/api/", spellcheck: "false", "aria-label": "URL de la API" });
  rows.append(el("div", { class: "row", style: "flex-wrap:wrap" },
    el("div", { class: "lab", style: "flex:1 0 100%" }, "URL de la API",
      el("small", { text: APP.base ? "Ahora: " + APP.base : "No se encuentra el servicio." })),
    inp,
    el("button", { class: "act", type: "button", text: "Guardar", onclick: async () => {
      const v = inp.value.trim();
      v ? prefs.set("api", v) : prefs.del("api");
      APP.base = null; toast("Buscando el servicio…"); await recargar();
    } })));
  /* intervalo de refresco */
  const seg = el("div", { class: "seg", style: "flex:0 0 auto" });
  for (const s of [3, 5, 10, 30]) seg.append(el("button", { type: "button", text: s + " s", "aria-pressed": String(prefs.get("poll", 5) === s),
    onclick: () => { prefs.set("poll", s); pintar(); } }));
  rows.append(filaAjuste("Actualizar cada", null, seg));
  caja.append(rows);
  /* programaciones: el servicio solo se las manda a un administrador */
  if (esAdmin() && progs().length) {
    const filas = el("div", { class: "rows" });
    for (const x of progs()) {
      const sub = ordenProg(x) + " «" + nombreProg(x.device) + "» " + momentoProg(x.when) + ", " + diasProg(x.days)
        + (x.last_result ? " · última vez: " + x.last_result : "");
      filas.append(el("div", { class: "row" },
        el("div", { class: "lab", style: x.enabled ? "" : "opacity:.5" }, x.name, el("small", { text: sub })),
        el("button", { class: "act", type: "button", text: x.enabled ? "Desactivar" : "Activar",
          onclick: async (e) => {
            e.currentTarget.disabled = true;
            try { await progActivar(x.id, !x.enabled); toast(x.enabled ? "Desactivada." : "Activada."); await recargar(); }
            catch (err) { e.currentTarget.disabled = false; toast(err.message, true); }
          } })));
    }
    caja.append(el("div", { class: "grp-h", style: "padding:14px 4px 6px" }, "Programaciones"), filas,
      el("div", { class: "hint", text: "Se crean y se cambian en la interfaz completa; aquí se activan y se desactivan." }));
  }
  caja.append(el("div", { class: "hint" }, "Dar de alta dispositivos, el modo nube y las contraseñas se hacen en la ",
    el("a", { href: APP.base ? APP.base.replace(/api\/$/, "") : INTERFAZ_COMPLETA, text: "interfaz completa de TeleHome" }), "."));
  caja.append(el("div", { class: "foot" },
    "TeleHome · " + LAYOUT_LABEL + " v" + VERSION + (APP.state ? " · servicio " + APP.state.version : ""), el("br"),
    "Rafael Puerto · Departamento de Ingeniería de Sistemas y Automática · Universidad Miguel Hernández de Elche", el("br"),
    "Generado con IA · Revisado por el autor · Última modificación: " + MODIFICADO));
  return caja;
}
/* textos de una programación, como en la app completa */
const DIAS_P = [["L", 1], ["M", 2], ["X", 3], ["J", 4], ["V", 5], ["S", 6], ["D", 7]];
function momentoProg(w) {
  if (w.kind === "clock") return "a las " + w.time;
  const cual = w.kind === "sunrise" ? "amanecer" : "anochecer", off = w.offset || 0;
  return off ? Math.abs(off) + " min " + (off < 0 ? "antes" : "después") + " del " + cual : "al " + cual;
}
function ordenProg(x) {
  if (x.action === "switch") return x.value ? "encender" : "apagar";
  if (x.action === "level") return "brillo al " + x.value + " %";
  if (x.action === "temp") return "blanco " + tempTxt(x.value);
  if (x.action === "color") return "color " + x.value;
  if (x.action === "mode") return x.value === "colour" ? "modo color" : "modo blanco";
  if (x.action === "position") return "abrir al " + x.value + " %";
  return "parar";
}
function diasProg(d) {
  if (!d.length) return "una sola vez";
  if (d.length === 7) return "todos los días";
  if (String(d) === "1,2,3,4,5") return "de lunes a viernes";
  if (String(d) === "6,7") return "fines de semana";
  return DIAS_P.filter(([, n]) => d.includes(n)).map(([l]) => l).join(" ");
}
const nombreProg = (id) => { const d = devs().find((x) => x.id === id); return d ? d.name : id; };
function pedirAdmin(texto) {
  hoja({ titulo: "Entrar", texto: texto || "Escribe tu contraseña. La de usuario permite manejar los dispositivos; la de administrador, además, configurarlo todo.",
    campo: "Contraseña", ok: "Entrar",
    onOk: async (pw) => {
      try { await entrarAdmin(pw); } catch (e) { return e.message; }
      toast("Has entrado como " + etiquetaNivel().toLowerCase() + "."); await recargar(); return "";
    } });
}

/* Contraseña del servicio: se escribe aquí, sin diálogo del navegador, y se recuerda en este dispositivo */
function pedirClaveServicio() {
  hoja({ titulo: "Contraseña del servicio", texto: "El servicio TeleHome está protegido. Escríbela una vez: se recuerda en este dispositivo.",
    campo: "Contraseña del servicio", ok: "Conectar",
    onOk: async (pw) => {
      if (!pw) return "Escribe la contraseña.";
      AUTH.set(pw); APP.base = null;   // se vuelve a buscar el servicio ya con la contraseña
      const ok = await loadState();
      if (!ok) return APP.needAuth ? "La contraseña no es correcta." : (APP.error || "No se pudo conectar.");
      toast("Conectado al servicio."); await recargar(); return "";
    } });
}

/* ---------- aviso de conexión ---------- */
/* Cabecera común: estado de la conexión (punto + texto), distintivo de nivel y botón de acceso. */
function estadoCabecera() {
  const hora = APP.updated ? new Date(APP.updated).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" }) : "";
  if (APP.needAuth) return { nivel: "warn", txt: "Contraseña requerida" };
  if (!APP.state) return APP.error ? { nivel: "bad", txt: "Sin conexión" } : { nivel: "idle", txt: "Conectando…" };
  const n = devs().length, on = devs().filter(online).length;
  if (!n) return { nivel: "idle", txt: "Sin dispositivos" };
  const txt = (on === n ? (n === 1 ? "1 en línea" : "Todos en línea (" + n + ")") : on ? on + " de " + n + " en línea" : "Ninguno en línea") + (hora ? " · " + hora : "");
  return { nivel: on === n ? "good" : on ? "warn" : "bad", txt };
}
function pintarCabecera() {
  const e = estadoCabecera(), dentro = APP.admin.nivel !== "none";
  $("#sub").textContent = e.txt;
  $("#dot").dataset.estado = e.nivel;
  $("#estado").title = e.txt;
  $("#roBadge").textContent = etiquetaNivel();
  $("#roBadge").hidden = esAdmin();
  const b = $("#btnAdmin");
  b.hidden = !pideClave();
  b.setAttribute("aria-pressed", String(dentro));
  b.setAttribute("aria-label", dentro ? "Salir (" + etiquetaNivel().toLowerCase() + ")" : "Entrar con tu contraseña");
  b.title = b.getAttribute("aria-label");
  const l = $("#btnAdmin .lbl"); if (l) l.textContent = dentro ? "Salir" : "Entrar";
}

function pintarAviso() {
  const b = $("#banner");
  if (APP.needAuth) {
    b.replaceChildren(APP.error || "El servicio pide contraseña.",
      el("button", { type: "button", text: "Escribir contraseña", onclick: pedirClaveServicio }));
    b.hidden = false; return;
  }
  if (APP.error) { b.replaceChildren(APP.error + " Comprueba que el servicio está en marcha o pon su URL en Ajustes."); b.hidden = false; return; }
  b.hidden = true;
}
</script>

<script>
/* =====================================================================
   TeleHome · iPad — vista dividida: dispositivos a la izquierda,
   gráfica y resumen a la derecha; los ajustes se abren en un panel.
   ===================================================================== */
const VERSION = "1.0.0", MODIFICADO = "2026-11-25 17:32", LAYOUT_LABEL = "iPad";
let ajustesAbiertos = false, derecha = "grafica";   // "grafica" | "resumen"

function pintar() {
  pintarAviso(); pintarCabecera();
  $("#btnAjustes").setAttribute("aria-pressed", String(ajustesAbiertos));
  $("#aside").replaceChildren(panelDispositivos());
  const main = $("#main");
  if (ajustesAbiertos) { main.replaceChildren(panelAjustes()); return; }
  const seg = el("div", { class: "seg", role: "group", "aria-label": "Vista", style: "max-width:260px;margin-bottom:14px" });
  for (const [k, lab] of [["grafica", "Gráfica"], ["resumen", "Resumen"]])
    seg.append(el("button", { type: "button", text: lab, "aria-pressed": String(derecha === k),
      onclick: () => { derecha = k; pintar(); recargarHistorico(); } }));
  main.replaceChildren(seg, derecha === "grafica" ? panelGrafica(320) : panelResumen());
}
async function recargar() { await loadState(); pintar(); if (typeof luzId !== "undefined" && luzId) pintarLuz(); }
async function recargarHistorico() { await loadHistory(); pintar(); }

$("#btnRefresh").addEventListener("click", async (e) => {
  const b = e.currentTarget; b.classList.add("spin");
  try {
    const r = await forzarLectura();
    if (r && r.refrescado === false) toast("Ya se actualizó hace un momento.");
    else if (r && r.pendientes) toast(r.pendientes + " dispositivo(s) no respondieron a tiempo.");
  } catch (err) { toast("No se pudo forzar la lectura: " + err.message); }
  await loadState(); await loadHistory(); pintar();
  setTimeout(() => b.classList.remove("spin"), 400);
});
$("#btnAdmin").addEventListener("click", async () => {
  if (APP.admin.nivel !== "none") { await salirAdmin(); toast("Has salido: vuelves al modo de solo lectura."); await recargar(); }
  else pedirAdmin();
});
$("#btnAjustes").addEventListener("click", () => { ajustesAbiertos = !ajustesAbiertos; pintar(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && cerrarHoja) cerrarHoja(); });
window.addEventListener("resize", () => { if (!ajustesAbiertos && derecha === "grafica") pintar(); });

pintar();
startPolling(async () => { await loadState(); await loadHistory(); pintar(); }, () => prefs.get("poll", 5));
</script>
</body>
</html>
