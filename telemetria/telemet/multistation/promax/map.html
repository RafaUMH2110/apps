<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>TeleMet MultiStation · Map of the stations</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2032%2032%27%3E%3Cdefs%3E%3ClinearGradient%20id=%27g%27%20x1=%270%27%20y1=%270%27%20x2=%271%27%20y2=%271%27%3E%3Cstop%20offset=%270%27%20stop-color=%27%232E6FD9%27/%3E%3Cstop%20offset=%271%27%20stop-color=%27%230B3C78%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width=%2732%27%20height=%2732%27%20rx=%278%27%20fill=%27%230F2237%27/%3E%3Crect%20x=%274%27%20y=%274%27%20width=%2724%27%20height=%2724%27%20rx=%276%27%20fill=%27url%28%23g%29%27/%3E%3Cpath%20d=%27M16%2025.5C12.2%2020.8%209.8%2017.6%209.8%2014.2a6.2%206.2%200%200%201%2012.4%200c0%203.4-2.4%206.6-6.2%2011.3z%27%20fill=%27white%27/%3E%3Ccircle%20cx=%2716%27%20cy=%2714.2%27%20r=%272.5%27%20fill=%27%230B3C78%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha512-Zcn6bjR/8RZbLEpLIeOwNtzREBAJnUKESxces60Mpoj+2okopSAcSUIUOseddDm0cxnGQzxIR7vJgsLZbdLE3w==" crossorigin="">
<style>
html,body{height:100%;margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif}#m{height:100%}
.leyenda{position:absolute;z-index:1000;top:10px;right:10px;background:#fff;border-radius:10px;padding:10px 12px;box-shadow:0 4px 18px rgba(0,0,0,.28);font-size:13px;max-width:60vw}
.leyenda b{display:block;margin-bottom:6px}
.leyenda button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:4px 2px;font:inherit;cursor:pointer;text-align:left}
.leyenda button:hover{background:#f0f3f7}
.leyenda i{width:12px;height:12px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px #0004}
.etq-est{font-weight:700;font-size:12.5px;background:#fff;border:1px solid #0003;border-radius:6px;padding:2px 6px}
.vacio{padding:24px;font-size:15px}
</style>
</head>
<body>
<!-- Station data arrives in the URL hash from index.html. This must be a real page (not a blob: URL) so the browser sends a Referer to the OpenStreetMap tile servers, as their tile usage policy requires. -->
<div id="m"></div>
<div class="leyenda" id="ley"><b>Stations</b></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha512-BwHfrr4c9kmRkLw6iXFdzcdWV/PGkVgiIyIWLLlTSXzWQzxuSg4DiQUCpauz/EWjgk5TYQqX/kvn9pG1NpYfqg==" crossorigin=""></script>
<script>
(function(){
  var D = null;
  try { D = JSON.parse(decodeURIComponent(location.hash.slice(1))); } catch (e) {}
  if (!D || !D.est || !D.est.length){ document.getElementById('m').innerHTML = '<p class="vacio">No station data. Open this map from TeleMet MultiStation (“view on map”).</p>'; return; }
  var esc = function(t){ return String(t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var map = L.map('m', { zoomControl: true });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '\u00a9 <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' }).addTo(map);
  var ms = {}, pts = [], ley = document.getElementById('ley');
  D.est.forEach(function(e){
    var dest = e.id === D.dest;
    var mk = L.circleMarker([e.lat, e.lon], { radius: dest ? 13 : 10, color: '#fff', weight: 3, fillColor: e.color, fillOpacity: 1 }).addTo(map);
    var t = (e.temp !== null ? e.temp.toString() + ' \u00b0C' : '');
    mk.bindTooltip(esc(e.nombre) + (t ? ' \u00b7 ' + t : ''), { permanent: true, direction: 'top', offset: [0, -10], className: 'etq-est' });
    mk.bindPopup('<b>' + esc(e.nombre) + '</b><br>' + esc(e.sid) + (e.barrio ? '<br>' + esc(e.barrio) : '') + (e.elev !== null ? '<br>' + e.elev + ' m' : '') + (t ? '<br>Temperature: ' + t : '') + (e.hum !== null ? '<br>Humidity: ' + e.hum + ' %' : ''));
    ms[e.id] = mk; pts.push([e.lat, e.lon]);
    var b = document.createElement('button');
    b.innerHTML = '<i style="background:' + esc(e.color) + '"></i>' + esc(e.nombre);
    b.onclick = function(){ map.setView([e.lat, e.lon], Math.max(map.getZoom(), 14)); mk.openPopup(); };
    ley.appendChild(b);
  });
  if (pts.length > 1) map.fitBounds(pts, { padding: [70, 70], maxZoom: 15 }); else map.setView(pts[0], 14);
  if (D.dest && ms[D.dest]) ms[D.dest].openPopup();
})();
</script>
</body>
</html>
