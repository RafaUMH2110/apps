# TeleMet Colector — configuración
# Copia este fichero como config.ini y ajusta los valores:
#     cp config.example.ini config.ini && chmod 600 config.ini
# config.ini lleva tu API Key: NO lo subas a GitHub (ya está en .gitignore).

[estacion]
station_id = TU_STATION_ID
api_key    = TU_API_KEY
# Alternativa sin escribir secretos aquí: variables de entorno
# TELEMET_STATION_ID y TELEMET_API_KEY (tienen prioridad sobre este fichero).

# --- VARIAS ESTACIONES ------------------------------------------------------
# Para leer más de una estación, deja [estacion] vacía (o bórrala) y añade una
# sección [estacion:ID_ESTACION] por cada una, cada una con su api_key. Cada
# estación se lee en su propio hilo, con su propia BD y su propio JSON
# (telemet_<ID>.sqlite e historial_<ID>.json, con el ID en mayúsculas).
# Opciones de cada sección (todas opcionales salvo api_key): intervalo_s,
# ruta_bd, ruta_json. La api_key también puede darse por la variable de entorno
# TELEMET_API_KEY_<ID> (ID en mayúsculas, con _ en lugar de signos).
#
# [estacion:IELCHE12]
# api_key = CLAVE_DE_ESTA_ESTACION
#
# [estacion:IALICA34]
# api_key = OTRA_CLAVE
# intervalo_s = 600          # opcional: ritmo propio de esta estación
#
# Alternativa por entorno: TELEMET_ESTACIONES=IELCHE12:CLAVE1,IALICA34:CLAVE2

[lectura]
url_base       = https://api.weather.com/v2/pws/observations/current
# Segundos entre consultas (mínimo 5). 300 = una lectura cada 5 min
# (288 llamadas/día). Con 60 serían 1.440 llamadas/día: revisa el límite
# diario de tu API Key, porque los visitantes de la app también consumen
# llamadas si usan la misma clave.
intervalo_s    = 300
# Tiempo máximo de espera de cada petición (s)
timeout_s      = 15
# Tras un fallo se reintenta a los base, 2·base, 4·base... segundos, con este tope
backoff_base_s = 2
backoff_max_s  = 300

[ciclo]
# Horas de histórico que se conservan (admite decimales). 24 h sirven para
# las gráficas de 12 h y de 24 h de TeleMet Historial. También se puede dar
# con la opción --horas o con la variable de entorno TELEMET_HORAS (tienen
# prioridad sobre este valor).
duracion_horas = 24
# deslizante -> solo se borran las lecturas con más de duracion_horas;
#               el servidor siempre conserva las últimas duracion_horas completas
# reinicio   -> pasadas duracion_horas se BORRA todo y se empieza de cero
#               (justo después, el histórico del servidor está vacío)
modo = deslizante

[almacen]
# Base de datos SQLite (ruta relativa a este fichero, o absoluta).
# Con varias estaciones se añade el ID al nombre (telemet_<ID>.sqlite); también
# se puede usar {station_id} en la ruta, p. ej. ./datos/{station_id}/telemet.sqlite
ruta_bd = ./datos/telemet.sqlite

[salida]
# JSON que lee la app TeleMet Historial. Debe estar dentro de la carpeta que
# sirve Apache, junto a la app (la app lo busca en ./datos/historial_<ID>.json
# y, si no existe, en ./datos/historial.json).
# Con varias estaciones se añade el ID al nombre (historial_<ID>.json) o se usa
# {station_id} en la ruta.
ruta_json = /var/www/htdocs/rafa/telemethistorial/datos/historial.json
# Decimales con los que se exportan los valores (la BD guarda el valor completo)
decimales = 2

[log]
# DEBUG, INFO, WARNING o ERROR
nivel   = INFO
# Fichero de log opcional (vacío = solo salida estándar, es decir, journald)
fichero =
