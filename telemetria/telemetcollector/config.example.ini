# TeleMet Collector — configuration
# Copy this file as config.ini and adjust the values:
#     cp config.example.ini config.ini && chmod 600 config.ini
# config.ini holds your API Key: do NOT upload it to GitHub (it is already in .gitignore).

[station]
station_id = YOUR_STATION_ID
api_key    = YOUR_API_KEY
# Alternative that avoids writing secrets here: the environment variables
# TELEMET_STATION_ID and TELEMET_API_KEY (they take priority over this file).

# --- SEVERAL STATIONS -------------------------------------------------------
# To read more than one station, leave [station] empty (or delete it) and add
# one [station:STATION_ID] section per station, each with its own api_key.
# Every station is read in its own thread, with its own DB and its own JSON
# (telemet_<ID>.sqlite and history_<ID>.json, with the ID in upper case).
# Options of each section (all optional except api_key): interval_s, db_path,
# json_path. The api_key can also be given through the environment variable
# TELEMET_API_KEY_<ID> (ID in upper case, with _ instead of symbols).
#
# [station:IELCHE12]
# api_key = KEY_OF_THIS_STATION
#
# [station:IALICA34]
# api_key = ANOTHER_KEY
# interval_s = 600           # optional: this station's own pace
#
# Alternative through the environment: TELEMET_STATIONS=IELCHE12:KEY1,IALICA34:KEY2

[reading]
base_url       = https://api.weather.com/v2/pws/observations/current
# Seconds between queries (minimum 5). 300 = one reading every 5 min
# (288 calls/day). With 60 it would be 1,440 calls/day: check the daily
# limit of your API Key, because visitors of the app also use up calls
# if they use the same key.
interval_s     = 300
# Maximum wait for each request (s)
timeout_s      = 15
# After a failure it retries after base, 2·base, 4·base... seconds, capped at this value
backoff_base_s = 2
backoff_max_s  = 300

[cycle]
# Hours of history that are kept (decimals allowed). 24 h are enough for the
# 12 h and 24 h charts of TeleMet History. It can also be given with the
# --hours option or the TELEMET_HOURS environment variable (they take
# precedence over this value).
duration_hours = 24
# sliding -> only readings older than duration_hours are deleted;
#            the server always keeps the last duration_hours in full
# reset   -> once duration_hours have elapsed, EVERYTHING is deleted and it
#            starts from scratch (right afterwards the server history is empty)
mode = sliding

[storage]
# SQLite database (path relative to this file, or absolute).
# With several stations the ID is added to the name (telemet_<ID>.sqlite); you
# can also use {station_id} in the path, e.g. ./data/{station_id}/telemet.sqlite
db_path = ./data/telemet.sqlite

[output]
# JSON read by the TeleMet History app. It must be inside the folder served
# by Apache, next to the app (the app looks for ./data/history_<ID>.json and,
# if it does not exist, ./data/history.json).
# With several stations the ID is added to the name (history_<ID>.json) or
# {station_id} is used in the path.
json_path = /var/www/htdocs/rafa/telemethistory/data/history.json
# Decimals used when exporting the values (the DB keeps the full value)
decimals = 2

[log]
# DEBUG, INFO, WARNING or ERROR
level = INFO
# Optional log file (empty = standard output only, i.e. journald)
file  =
